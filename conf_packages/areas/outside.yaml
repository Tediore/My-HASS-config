automation:
- alias: Turn outside lights on at night
  id: 'outside-lights-on-at-night'
  initial_state: true
  trigger:
  - platform: numeric_state
    entity_id: sensor.outdoor_light_level
    below: 10
    for: '00:05:00'
  condition:
  - condition: time
    after: '16:00:00'
    before: '22:00:00'
  action:
  - service: light.turn_on
    entity_id: &outside_lights light.patio_lights
    data:
      brightness_pct: 100


- alias: Turn outside lights off at sunrise
  id: 'outside-lights-off-sunrise'
  initial_state: true
  trigger:
  - platform: sun
    event: sunrise
    offset: '-01:00:00'
  action:
  - service: homeassistant.turn_off
    target:
      entity_id: *outside_lights


- alias: Notify when garage door opened/closed
  id: 'notify-garage-open-closed'
  initial_state: true
  mode: 'parallel'
  trigger:
  - platform: state
    entity_id: &garage_door cover.garage_door
    to:
  action:
  - service: notify.gotify_high
    data:
      message: "Garage door {{ trigger.to_state.state }}"


- alias: Turn garage lights on with doors
  id: 'garage-lights-on-doors'
  initial_state: true
  trigger:
  - platform: state
    entity_id: 
    - *garage_door
    - &man_door binary_sensor.garage_man_door
    to:
    - 'open'
    - 'on'
  condition:
  - condition: state
    entity_id: &garage_lights light.garage
    state: 'off'
  action:
  - service: light.turn_on
    entity_id: *garage_lights


- alias: Turn garage lights off with doors and person detection
  id: 'garage-lights-off-doors-person-detection'
  initial_state: true
  trigger:
  - platform: state
    entity_id:
    - *garage_door
    - *man_door
    - &garage_occupancy binary_sensor.garage_person_occupancy
    to:
    - 'closed'
    - 'off'
    for: &off_time '00:10:00'
  condition:
  - condition: state
    entity_id: *garage_occupancy
    state: 'off'
    for: *off_time
  - condition: state
    entity_id: *garage_lights
    state: 'on'
  action:
  - service: light.turn_off
    entity_id: *garage_lights


template:
- cover:
  - name: Garage door
    unique_id: shelly-garage-door-controller
    state: "{{ is_state('binary_sensor.garage_door_controller_contact_sensor', 'on') }}"
    device_class: garage
    open_cover:
    - condition: state
      entity_id: &garage_door_state binary_sensor.garage_door_controller_contact_sensor
      state: 'off'
    - condition: state
      entity_id: input_boolean.garage_lock
      state: 'off'
    - action: switch.turn_on
      entity_id: &garage_door_relay switch.garage_door_controller_relay
    close_cover: &close_or_stop
    - condition: state
      entity_id: *garage_door_state
      state: 'on'
    - action: switch.turn_on
      entity_id: *garage_door_relay
    stop_cover: *close_or_stop
    icon: >
      {% set dict = {
        'off': '',
        'on': '-open',
        'unavailable': '-alert'
        } %}
      mdi:garage{{ dict[states('binary_sensor.garage_door_controller_contact_sensor')] }}
    

- sensor:
  - name: Outside temp
    unique_id: outside-temp-c
    state: "{{ states('sensor.outdoor_temp') | float(0) | round(1) }}"
    unit_of_measurement: "°C"
  - name: Outside temp F
    unique_id: outside-temp-f
    state: "{{ (((states('sensor.outdoor_temp') | float(0)) * 9 / 5) + 32) | round(1) }}"
    unit_of_measurement: "°F"
  - name: Outside dew point display
    unique_id: outside-dew-pt-c
    state: "{{ states('sensor.outside_dew_point') | float(0) | round(1) }}"
    unit_of_measurement: "°C"
  - name: Outside dew point F display
    unique_id: outside-dew-pt-f
    state: "{{ (((states('sensor.outside_dew_point') | float(0)) * 9 / 5) + 32) | round(1) }}"
    unit_of_measurement: "°F"


input_boolean:
  garage_lock:
    name: Garage lock