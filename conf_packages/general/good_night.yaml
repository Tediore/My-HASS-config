automation:
- alias: Andy's button
  id: 'andys-bedroom-button'
  initial_state: true
  mode: parallel
  trigger:
  - platform: state
    id: single
    entity_id: &andy_button sensor.andy_button_action
    to: 
    - 'on'
    - 'off'
  - platform: state
    id: hold
    entity_id: *andy_button
    to: 
    - 'brightness_move_up'
    - 'brightness_move_down'
  action:
    service: >
      {% if trigger.id == 'single' %}
        {% if is_state('input_boolean.andy_sleep', 'off') %}
          script.good_night_andy
        {% else %}
          script.toggle_bedroom_fan
        {% endif %}
      {% else %}
        script.good_night
      {% endif %}


- alias: Matt's button
  id: 'matts-bedroom-button'
  initial_state: true
  mode: parallel
  trigger: &matt_triggers
  - platform: state
    id: single
    entity_id: &matt_button sensor.matt_button_action
    to: 'single'
  - platform: state
    id: hold
    entity_id: *matt_button
    to: 'hold'
  action:
  - service: script.turn_on
    data:
      entity_id: >
        {% if trigger.id == 'single' %}
          {% if is_state('input_boolean.sleep_mode', 'off') %}
            script.good_night
          {% else %}
            script.toggle_bedroom_fan
          {% endif %}
        {% else %}
          script.toggle_bedroom_fan
        {% endif %}


script:
  good_night:
    alias: Good night
    sequence:
    - service: homeassistant.turn_on
      entity_id: 
      - input_boolean.sleep_mode
      - input_boolean.andy_sleep
      - input_boolean.garage_lock
      - script.good_night_lights_off
      - script.christmas_lights_off
      - script.media_players_off
      - switch.bedroom_fan
      - script.camera_display_off
    - service: homeassistant.turn_off
      target:
        entity_id:
        - input_boolean.washer
        - input_boolean.dryer
        - fan.living_room
        - fan.matts_office
    - service: light.turn_on
      entity_id: light.main_bath_night_light
      data:
        brightness_pct: 10
    - service: light.turn_on
      entity_id: light.patio_lights
      data:
        brightness_pct: 5
    - if:
      - "{{ is_state('alarm_control_panel.home', 'disarmed') }}"
      - "{{ is_state('input_boolean.overnight_guest', 'off') }}"
      then:
      - service: alarm_control_panel.alarm_arm_night
        data:
          entity_id: alarm_control_panel.home
          code: !secret alarm_code_system
    - if:
      - "{{ is_state('switch.humidifier', 'off') }}"
      then:
      - service: switch.turn_on
        entity_id: switch.humidifier

  good_night_andy:
    sequence:
    - service: input_boolean.turn_on
      entity_id: input_boolean.andy_sleep
    - service: homeassistant.turn_off
      target:
        entity_id: light.bedroom_lamps
    - service: light.turn_on
      entity_id: light.main_bath_night_light
      data:
        brightness_pct: 10
    - if:
      - "{{ is_state('alarm_control_panel.home', 'disarmed') }}"
      - "{{ is_state('input_boolean.overnight_guest', 'off') }}"
      then:
      - service: alarm_control_panel.alarm_arm_night
        data:
          entity_id: alarm_control_panel.home
          code: !secret alarm_code_system
    - if:
      - "{{ is_state('switch.humidifier', 'off') }}"
      then:
      - service: switch.turn_on
        entity_id: switch.humidifier

  media_players_off:
    sequence:
    - service: media_player.turn_off
      entity_id: all

  good_night_lights_off:
    sequence:
    - service: homeassistant.turn_off
      target:
        entity_id: group.good_night_lights

  christmas_lights_off:
    sequence:
    - condition: state
      entity_id: light.christmas_lights
      state: 'on'
    - service: light.turn_off
      entity_id: light.christmas_lights


input_boolean:
  sleep_mode:
  andy_sleep: